name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system OCR binary
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr,flow,mcp,template]"
          pip install build twine

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=openframe --cov-report=term-missing

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Wheel install smoke test
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/open-frame-wheel
          /tmp/open-frame-wheel/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/open-frame-wheel/bin/open-frame mcp list-tools --json > /tmp/open-frame-tools.json
          /tmp/open-frame-wheel/bin/python - <<'PY'
          import json
          import tomllib
          from importlib.metadata import version
          from pathlib import Path

          payload = json.loads(Path("/tmp/open-frame-tools.json").read_text())
          names = {item["name"] for item in payload["tools"]}
          required = {
              "capture",
              "find",
              "click",
              "type",
              "key",
              "scroll",
              "run_flow",
              "get_run_artifacts",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing tools: {sorted(missing)}")
          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          installed = version("off-camber-open-frame")
          print(f"installed {installed}; pyproject {expected}; tools {sorted(names)}")
          if installed != expected:
              raise SystemExit(f"installed {installed} != pyproject {expected}")
          PY

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Tesseract
        run: brew install tesseract

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr,flow,mcp,template]"

      - name: Probe screen capture
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          dest = Path("/tmp/open-frame-ci-probe.png")
          dest.unlink(missing_ok=True)
          try:
              completed = subprocess.run(
                  ["screencapture", "-x", str(dest)],
                  timeout=20,
                  capture_output=True,
                  text=True,
              )
          except subprocess.TimeoutExpired:
              print("SCREEN_CAPTURE=unavailable reason=timed out after 20s")
              raise SystemExit(0)
          size = dest.stat().st_size if dest.is_file() else 0
          print(f"exit={completed.returncode}")
          if completed.stdout:
              print(completed.stdout)
          if completed.stderr:
              print(completed.stderr)
          print(f"bytes={size}")
          if completed.returncode == 0 and size > 0:
              print("SCREEN_CAPTURE=ok")
          else:
              print("SCREEN_CAPTURE=unavailable")
          PY

      - name: Run tests
        run: pytest
