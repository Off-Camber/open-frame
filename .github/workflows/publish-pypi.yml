name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.2.2
        required: true
        type: string
      republish_existing:
        description: Rebuild that tag and upload with skip-existing. Skips lint and tests.
        required: false
        type: boolean
        default: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check tag matches package version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [ -f scripts/check_release_tag.py ]; then
            python scripts/check_release_tag.py "${TAG}"
          else
            python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG"].strip()
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"].strip()
          got = tag.removeprefix("refs/tags/").removeprefix("v")
          if not tag or got != version:
              print(
                  f"release tag {tag} does not match pyproject version {version}; expected v{version}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"release tag {tag} matches pyproject version {version}")
          PY
          fi

  test:
    needs: tag
    if: github.event.inputs.republish_existing != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system OCR binary
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr,flow,mcp,template]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=openframe --cov-report=term-missing --cov-fail-under=80

  publish:
    needs: [tag, test]
    if: always() && needs.tag.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check tag matches package version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [ -f scripts/check_release_tag.py ]; then
            python scripts/check_release_tag.py "${TAG}"
          else
            python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          tag = os.environ["TAG"].strip()
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"].strip()
          got = tag.removeprefix("refs/tags/").removeprefix("v")
          if not tag or got != version:
              print(
                  f"release tag {tag} does not match pyproject version {version}; expected v{version}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"release tag {tag} matches pyproject version {version}")
          PY
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build --sdist --wheel

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
