version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # mcp>=1.0,<2 is a range, so Dependabot has no current version and does
      # not classify widening it as version-update:semver-major. Ignore 2.x
      # and later by version. 1.x updates can still open.
      - dependency-name: "mcp"
        versions:
          - ">=2"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
