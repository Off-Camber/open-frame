name: calibration-token
variables:
  # Prefer digits/consonants: leading O in OFMARKZXQ is often OCR'd as Q on
  # Retina TextEdit crops, while Cursor may also display markers on-screen.
  marker: "CALMARK89"
  token: "{{marker}} {{run_id}}"
steps:
  - id: focus-textedit
    kind: app
    name: "TextEdit"

  # AppleScript set closes leftover docs/sheets, creates a fresh document, and
  # sets large text — avoids keystroke races and save-sheet occlusion.
  - id: type-token
    kind: type
    text: "{{token}}"
    via: applescript
    size: 48
    window:
      app: "TextEdit"

  - id: wait-settle
    kind: wait
    ms: 900

  - id: refocus-before-verify
    kind: app
    name: "TextEdit"

  - id: verify-token-visible
    kind: verify
    timeout_ms: 12000
    poll_ms: 250
    scope: window
    window:
      app: "TextEdit"
    specs:
      - 'window-app:"TextEdit"'
      - 'text-appeared:"{{marker}}"'

  - id: refocus-before-close
    kind: app
    name: "TextEdit"

  # Close without save prompts (Cmd+W can leave sheets that poison the next run).
  - id: close-document
    kind: type
    text: ""
    via: applescript-close
    window:
      app: "TextEdit"

  - id: wait-after-close
    kind: wait
    ms: 400
