name: calibration-token-miss
variables:
  marker: "CALMARK89"
  missing: "CALMISSING99"
steps:
  - id: focus-textedit
    kind: app
    name: "TextEdit"

  - id: type-marker-only
    kind: type
    text: "{{marker}}"
    via: applescript
    size: 48
    window:
      app: "TextEdit"

  - id: wait-settle
    kind: wait
    ms: 400

  - id: refocus-before-close
    kind: app
    name: "TextEdit"

  # Close before the intentional failure so the run does not leave docs/sheets.
  - id: close-document
    kind: type
    text: ""
    via: applescript-close
    window:
      app: "TextEdit"

  - id: wait-after-close
    kind: wait
    ms: 400

  - id: verify-missing-text
    kind: verify
    timeout_ms: 1500
    poll_ms: 250
    specs:
      - 'text-appeared:"{{missing}}"'
