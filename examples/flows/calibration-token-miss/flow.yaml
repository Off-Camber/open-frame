name: calibration-token-miss
variables:
  marker: "OFMARKZXQ"
  missing: "OFMISSINGZZZ"
steps:
  - id: focus-textedit
    kind: app
    name: "TextEdit"

  - id: new-document
    kind: key
    combo:
      - command
      - n
    window:
      app: "TextEdit"

  - id: wait-document
    kind: wait
    ms: 900

  - id: type-marker-only
    kind: type
    text: "{{marker}}"
    window:
      app: "TextEdit"

  - id: wait-settle
    kind: wait
    ms: 500

  - id: refocus-before-close
    kind: app
    name: "TextEdit"

  # Close before the intentional failure so the run does not leave an Untitled
  # window behind when verify stops the flow.
  - id: close-document
    kind: key
    combo:
      - command
      - w
    window:
      app: "TextEdit"

  - id: wait-save-sheet
    kind: wait
    ms: 700

  - id: discard-save
    kind: click
    query: "Delete"
    selector: left_most
    timeout_ms: 4000
    poll_ms: 200

  - id: wait-after-close
    kind: wait
    ms: 400

  - id: verify-missing-text
    kind: verify
    timeout_ms: 1500
    poll_ms: 250
    specs:
      - 'text-appeared:"{{missing}}"'
