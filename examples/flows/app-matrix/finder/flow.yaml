name: app-matrix-finder
description: >
  Non-destructive Finder probe — activate Finder, find a stable sidebar/chrome
  label (not menu-bar File, which is outside window scope), verify frontmost app.
steps:
  - id: focus-finder
    kind: app
    name: "Finder"

  - id: wait-settle
    kind: wait
    ms: 1000

  - id: find-finder-chrome
    kind: find
    query: "Finder"
    timeout_ms: 10000
    poll_ms: 250
    selector: first

  - id: verify-finder
    kind: verify
    timeout_ms: 5000
    poll_ms: 250
    specs:
      - 'window-app:"Finder"'
      - 'text-appeared:"Finder"'
