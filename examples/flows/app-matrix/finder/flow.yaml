name: app-matrix-finder
description: >
  Non-destructive Finder probe — activate Finder, find the list-view column
  header inside the Finder window, verify frontmost app. The window title is
  the folder name, so the app name is not a label in the window.
steps:
  - id: focus-finder
    kind: app
    name: "Finder"

  - id: wait-settle
    kind: wait
    ms: 1000

  - id: find-finder-chrome
    kind: find
    query: "Date Added"
    timeout_ms: 10000
    poll_ms: 250
    selector: first
    scope: window
    window:
      app: "Finder"

  - id: verify-finder
    kind: verify
    timeout_ms: 5000
    poll_ms: 250
    scope: window
    window:
      app: "Finder"
    specs:
      - 'window-app:"Finder"'
      - 'text-appeared:"Date Added"'
